# Run this first. It is not a training run -- it proves the loop closes.
#
# Twenty steps on the smallest Qwen3 and the easiest family, which is enough to
# surface every failure that is cheap to fix and expensive to discover late: a
# missing wheel, a chat template that does not open <think>, a batch size that
# is not a multiple of num_generations, a reward function raising on the first
# malformed rollout. Roughly ten minutes and a few GB of VRAM.
#
# Watch `reward` in the log. It should be noisy but non-zero within a few steps
# -- Caesar at difficulty 0 is solvable by the base model some of the time. A
# reward pinned at exactly 0.0 means the completions are not being parsed, not
# that the model is bad; dump one and check where </think> landed.

model:
  name: Qwen/Qwen3-1.7B
  load_in_4bit: false        # small enough not to need it; one less wheel to install
  attn_implementation: sdpa

data:
  train_size: 128
  eval_size: 16
  families:
    - caesar
  max_difficulty: 0

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  bias: none
  target_modules: [q_proj, k_proj, v_proj, o_proj]

rewards:
  correctness: 2.0
  partial: 0.4
  format: 0.3
  invalid_penalty: 0.6
  budget_penalty: 0.2
  think_budget_chars: 2000

training:
  output_dir: runs/smoke
  num_generations: 4
  per_device_train_batch_size: 4   # must stay a multiple of num_generations
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  lr_scheduler_type: constant
  warmup_steps: 0
  beta: 0.02
  max_steps: 20
  max_prompt_length: 768
  # 512 was too tight: Qwen3 in thinking mode spent the whole budget inside
  # <think> and got cut off before closing it, so every rollout parsed as
  # invalid and every group had identical reward -- GRPO had no advantage
  # signal at all (frac_reward_zero_std was 1.0 for all 20 steps).
  max_completion_length: 1536
  temperature: 1.0
  top_p: 0.95
  bf16: true
  # On, despite this being the cheap config: at 1536-token completions the
  # A10G OOM'd at 20.5GiB of 22GiB with it off. Recomputing activations in
  # the backward pass costs ~30% wall clock and is the difference between
  # this running and not running at all.
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 20
  eval_strategy: "no"
  report_to: []
  use_vllm: false
